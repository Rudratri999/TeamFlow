services:
  nginx:
    image: nginx:alpine
    ports:
      - 80:80
    # ./nginx/nginx.conf = computer's nginx file is mounted on nginx container file(/etc/nginx/conf.d/default.conf:ro)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    
  postgres:
    image: postgres:18
    environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teamflow
    ports:
        - 5432:5432
 
  backend:
    build: .
    ports:
      - 8000:8000
    depends_on:
      - postgres
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

  redis:
    image: redis:7
    ports:
     - "6379:6379"
    networks:
      - default